spring.application.name=cutroom-learning
server.address=127.0.0.1
server.port=8081

# First create a separate database manually using database/setup.sql.
# No createDatabaseIfNotExist option: a typo should not create an unwanted database.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cutroom_learning}?connectionTimeZone=UTC
spring.datasource.username=${DB_USER:cutroom_learning}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Supply a random Base64-encoded secret containing at least 32 random bytes.
# A missing or weak secret stops startup; there is deliberately no default key.
app.jwt.secret=${JWT_SECRET}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
